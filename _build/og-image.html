<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Teachers:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  body{background:#fff;color:#000;font-family:'Teachers',sans-serif;position:relative;}
  .frame{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between;}
  .frame img{height:52px;width:auto;display:block;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:66px;line-height:1.12;letter-spacing:-0.01em;max-width:1020px;}
  h1 em{font-style:italic;}
  .foot{display:flex;justify-content:space-between;align-items:center;border-top:2px solid #000;padding-top:26px;}
  .eyebrow{font-size:21px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;}
  .url{font-size:24px;font-weight:600;}
</style>
</head>
<body>
  <div class="frame">
    <div><img src="../assets/thothica-logo-black.png" alt="Thothica" /></div>
    <h1>Hard problems can be solved when people understand their data. <em>Thothica helps them do that by building ontologies and AI-native software.</em></h1>
    <div class="foot">
      <span class="eyebrow">Data ontology</span>
      <span class="url">thothica.com</span>
    </div>
  </div>
</body>
</html>
